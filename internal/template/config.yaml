# hal configuration file
# This file controls the behavior of the hal autonomous agent.

# ─────────────────────────────────────────────────────────────────────────────
# Engine Settings
# ─────────────────────────────────────────────────────────────────────────────

# Which AI engine to use for code generation.
# Options: claude, codex, pi
# Default: codex
engine: codex

# Maximum number of iterations for the main loop.
# The loop will stop after this many iterations even if tasks remain.
# Default: 10
maxIterations: 10

# Delay between retries when an iteration fails (e.g., "30s", "1m").
# Default: 30s
retryDelay: 30s

# Maximum number of retries for a failed iteration before giving up.
# Default: 3
maxRetries: 3

# ─────────────────────────────────────────────────────────────────────────────
# Per-Engine Settings (optional)
# ─────────────────────────────────────────────────────────────────────────────
# Configure model and provider overrides for each engine.
# Omit or leave empty to use each engine's own defaults.
#
# engines:
#   claude:
#     model: claude-sonnet-4-20250514
#     timeout: 30m    # Per-session timeout (default: 30m)
#   codex:
#     model: o3
#     timeout: 30m    # Raise this for long Codex sessions / xhigh reasoning
#   pi:
#     provider: anthropic
#     model: claude-sonnet-4-20250514
#     timeout: 30m

# ─────────────────────────────────────────────────────────────────────────────
# Command Defaults (optional)
# ─────────────────────────────────────────────────────────────────────────────
# These defaults are applied only when the matching CLI flag is omitted.
# CLI flags always win over values from this file.
#
# run:
#   # Default base branch for `hal run --base`.
#   base: develop
#
#   # Per-engine session timeout for `hal run --timeout`.
#   timeout: 20m
#
# factory:
#   defaults:
#     # Default base branch for factory run/trigger when --base is omitted.
#     base: develop
#
#     # Default executor for factory run/trigger: local or sandbox.
#     # Use sandbox when project work should happen in a configured sandbox by default.
#     executor: sandbox
#
#     # Sandbox target defaults for factory run when executor is sandbox.
#     sandboxName: dev
#     sandboxHost: local-worker
#     sandboxRuntime: ssh_machine
#
#     # Default publish runner: host, sandbox, or auto.
#     publishFrom: host
#
#     # Environment variable names to resolve at execution time.
#     # Do not put raw secret values here.
#     secretEnv:
#       - GITHUB_TOKEN
#
#   policy:
#     # Governance policy remains separate from command defaults.
#     # Defaults shown here are examples, not requirements.
#     ciPolicy: skip-if-unavailable
#     publishPolicy: none
#     sandboxRequired: false
#     prCreationAllowed: true
#     mergeAllowed: false
#
# ci:
#   status:
#     # Defaults for `hal ci status` when matching flags are omitted.
#     wait: false
#     timeout: 30m
#     poll: 15s
#     noChecksGrace: 2m
#
#   fix:
#     # Default for `hal ci fix --max-attempts`.
#     maxAttempts: 3
#
#   merge:
#     # Defaults for `hal ci merge` when matching flags are omitted.
#     strategy: squash
#     deleteBranch: false
#     allowNoChecks: false
#
# sandbox:
#   defaults:
#     # Sandbox target defaults are used only when --sandbox is active.
#     # They do not make `hal run` or `hal auto` enter sandbox mode by themselves.
#     name: dev
#     host: local-worker
#     runtime: ssh_machine
#
#     # run/auto sandbox execution currently supports clone-mode command planning.
#     workspaceMode: clone
#
#     # Collect sync-out metadata by default, but keep host apply opt-in.
#     syncOut: true
#     apply: false

# ─────────────────────────────────────────────────────────────────────────────
# Auto Pipeline Settings (hal auto)
# ─────────────────────────────────────────────────────────────────────────────

auto:
  # Default base branch for `hal auto --base` when omitted.
  # Example: develop
  # base: develop

  # Directory where analysis reports are stored.
  # The auto command looks here for reports to analyze.
  # Default: .hal/reports
  reportsDir: .hal/reports

  # Prefix for branches created by the auto pipeline.
  # Branch names will be: {branchPrefix}{feature-slug}
  # Default: compound/
  branchPrefix: compound/

  # Entry-source discovery order when hal auto has no explicit inputs.
  # report_first: latest report in auto.reportsDir, then newest .hal/prd-*.md
  # markdown_first: newest .hal/prd-*.md, then latest report in auto.reportsDir
  # Default: report_first
  sourcePriority: report_first

  # Convert mode policy for hal auto runs.
  # auto: markdown entry -> standard (US stories), report entry -> granular (T tasks)
  # standard: always standard (US stories)
  # granular: always granular (T tasks)
  # Default: auto
  convertMode: auto

  # Quality check commands to run after each iteration.
  # These should exit with code 0 on success.
  # Example: ["make test", "make lint", "make vet"]
  # Default: []
  qualityChecks: []

  # Maximum iterations for the auto pipeline loop.
  # This is separate from the main maxIterations setting.
  # Default: 25
  maxIterations: 25

  # Policy preset for CI/review behavior.
  # Options: fast, balanced, strict
  # Default: balanced
  mode: balanced

  # Enable CI gate in auto runs.
  # Default (balanced): true
  ciEnabled: true

  # Enable review gate in auto runs.
  # Default (balanced): true
  reviewEnabled: true

  # Consecutive clean review cycles required to pass review gate.
  # Default (balanced): 1
  reviewCleanStreak: 1

  # Maximum review cycles before review gate fails.
  # Default (balanced): 10
  reviewMaxIterations: 10

# ─────────────────────────────────────────────────────────────────────────────
# Daytona Sandbox Settings (optional)
# ─────────────────────────────────────────────────────────────────────────────
# Configure credentials for Daytona sandbox integration.
# Run `hal sandbox setup` to set these interactively.
# Do not commit raw secret values in project templates. The provider receives:
# - DAYTONA_API_KEY
# - DAYTONA_SERVER_URL
